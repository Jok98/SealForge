name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version for packaging runs (numeric, for example 0.1.0)"
        required: false
        default: "0.1.0"
      publish_release:
        description: "Create or update a GitHub Release after packaging completes"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Temurin 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run test suite
        run: mvn -B test

  package:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: sealforge-linux
            platform_id: linux
          - os: windows-latest
            artifact_name: sealforge-windows
            platform_id: windows
          - os: macos-latest
            artifact_name: sealforge-macos
            platform_id: macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Temurin 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve package version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="0.1.0"
          fi

          echo "package_version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "revision=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Resolve WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wixBin = Get-ChildItem -Path "${env:ProgramFiles(x86)}\WiX Toolset*\bin", "${env:ProgramFiles}\WiX Toolset*\bin" `
              -Directory -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1

          if (-not $wixBin) {
              choco install wixtoolset -y
              $wixBin = Get-ChildItem -Path "${env:ProgramFiles(x86)}\WiX Toolset*\bin", "${env:ProgramFiles}\WiX Toolset*\bin" `
                  -Directory -ErrorAction SilentlyContinue |
                  Sort-Object FullName -Descending |
                  Select-Object -First 1
          }

          if (-not $wixBin) {
              throw "WiX installation path could not be resolved."
          }

          $wixBin.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using WiX from $($wixBin.FullName)"

      - name: Build modular app image
        shell: bash
        run: >
          mvn -B
          -DskipTests
          -Drevision=${{ steps.version.outputs.revision }}
          clean package javafx:jlink

      - name: Build native installer on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        env:
          SEALFORGE_PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: ./scripts/release/build-installer.sh

      - name: Build native installer on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SEALFORGE_PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: ./scripts/release/build-installer.ps1

      - name: Stage release assets
        shell: bash
        env:
          PLATFORM_ID: ${{ matrix.platform_id }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob

          copied_any=false

          for path in dist/jpackage/*; do
            if [[ -f "${path}" ]]; then
              base="$(basename "${path}")"
              stem="${base%.*}"
              ext="${base##*.}"
              if [[ "${stem}" == "${base}" ]]; then
                destination="release-assets/${base}-${PLATFORM_ID}"
              else
                destination="release-assets/${stem}-${PLATFORM_ID}.${ext}"
              fi
              cp "${path}" "${destination}"
              copied_any=true
            fi
          done

          for path in target/sealforge*.zip; do
            if [[ -f "${path}" ]]; then
              base="$(basename "${path}")"
              stem="${base%.zip}"
              cp "${path}" "release-assets/${stem}-${PLATFORM_ID}.zip"
              copied_any=true
            fi
          done

          if [[ "${copied_any}" == false ]]; then
            echo "No release assets were staged." >&2
            exit 1
          fi

          ls -la release-assets

      - name: Upload packaging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            release-assets/**

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            TAG_NAME="v${INPUT_VERSION}"
            VERSION="${INPUT_VERSION}"
          else
            echo "Manual release publishing requires the version input to be set." >&2
            exit 1
          fi

          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "release_name=SealForge ${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "target_commitish=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: sealforge-*
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          name: ${{ steps.release.outputs.release_name }}
          target_commitish: ${{ steps.release.outputs.target_commitish }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-artifacts/**
